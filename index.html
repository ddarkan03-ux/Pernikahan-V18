<style>
:root{--ivory:#fbf8f1;--paper:#f3eee1;--sage-l:#eef1e7;--sage:#7f9272;--sage-d:#566b4d;--gold:#b8975a;--gold-d:#977a40;--blush:#ecd3cb;--ink:#3b3a33;--mut:#7a766a;--script:'Great Vibes','Allura','Brush Script MT',cursive;--serif:'Cormorant Garamond','Playfair Display',Georgia,serif;--sans:'Montserrat','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;font-size:13.5px;line-height:1.85;color:var(--ink);background:#2c3328;overflow-x:hidden}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.bgfx{position:fixed;inset:0;background:#2c3328 center/cover no-repeat;filter:blur(22px) brightness(.4) saturate(.9);transform:scale(1.1);z-index:-1}
.app{position:relative;max-width:480px;margin:0 auto;background:var(--ivory);min-height:100vh;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.55)}
.side{display:none}
@media(min-width:1100px){
 .side{display:flex;position:fixed;top:0;bottom:0;left:0;width:calc(50% - 240px);flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fbf8f1;padding:40px}
 .side .e{font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:#d9bf85}
 .side .n{font-family:var(--script);font-size:96px;line-height:1.1;margin:10px 0}
 .side .d{font-size:13px;letter-spacing:.3em;text-transform:uppercase}
 .side .t{margin-top:22px;font-size:12px;opacity:.7}
}

/* ---------- hiasan ---------- */
.dc{position:absolute;pointer-events:none;z-index:0}
.sec>*:not(.dc){position:relative;z-index:1}
.fl{width:190px;height:190px}
.fl.tl{top:0;left:0}.fl.tr{top:0;right:0;transform:scaleX(-1)}.fl.bl{bottom:0;left:0;transform:scaleY(-1)}.fl.br{bottom:0;right:0;transform:scale(-1,-1)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto;width:170px}
.orn i{flex:1;height:1px;background:var(--gold)}
.orn b{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.fs{width:54px;height:54px;margin:0 auto 6px;display:block}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--sage-d);color:var(--ivory);border:1px solid var(--sage-d);border-radius:999px;padding:13px 30px;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:.25s}
.btn:active{transform:scale(.96)}
.btn.o{background:transparent;color:var(--sage-d);border-color:var(--gold)}
.btn.s{padding:9px 18px;font-size:10px;letter-spacing:.14em}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cover ---------- */
.cover{position:fixed;z-index:60;top:0;bottom:0;left:max(0px,calc(50% - 240px));width:min(100%,480px);display:flex;flex-direction:column;padding:30px 26px;text-align:center;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#fffdf8,#f6f1e4 70%);transition:transform 1.1s cubic-bezier(.7,0,.2,1),opacity 1.1s}
.cover.out{transform:translateY(-101%);opacity:0;pointer-events:none}
.cover::before{content:"";position:absolute;inset:14px;border:1px solid var(--gold);pointer-events:none;z-index:0}
.cover::after{content:"";position:absolute;inset:19px;border:1px solid rgba(184,151,90,.4);pointer-events:none;z-index:0}
.cover>*:not(.dc){position:relative;z-index:1}
.ci{margin:auto 0;display:flex;flex-direction:column;align-items:center;padding:38px 0}
.mono{display:inline-grid;place-items:center;width:70px;height:70px;border-radius:50%;border:1px solid var(--gold);box-shadow:0 0 0 4px var(--ivory),0 0 0 5px rgba(184,151,90,.5);font-family:var(--script);font-size:30px;line-height:1;color:var(--gold-d);margin-bottom:18px}
.eyebrow{font-size:10.5px;letter-spacing:.45em;text-transform:uppercase;color:var(--mut);font-weight:400;margin-left:.45em}
.cover .nm{font-family:var(--script);font-size:clamp(60px,19vw,84px);line-height:.95;color:var(--sage-d);margin:10px 0 6px}
.cover .nm em{display:block;font-style:normal;font-size:.5em;color:var(--gold);line-height:1}
.cover .tg{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--ink);margin-left:.3em}
.gst{margin:24px 0 20px;width:100%;max-width:290px;padding:14px 16px 12px;border:1px solid var(--gold);outline:1px solid rgba(184,151,90,.45);outline-offset:4px}
.gst small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--mut)}
.gst b{display:block;font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.25;color:var(--ink);margin:2px 0;overflow-wrap:anywhere}
.gst i{display:block;font-style:normal;font-size:10px;color:var(--mut)}

/* ---------- umum ---------- */
.sec{position:relative;padding:86px 26px;text-align:center;overflow:hidden}
.sec.alt{background:var(--sage-l)}
.hd{margin-bottom:30px}
.hd .l{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--mut);font-weight:400;margin-left:.42em}
.hd h2{font-family:var(--script);font-weight:400;font-size:56px;line-height:1.1;color:var(--gold-d);margin-top:4px}
.sub{font-size:13px;color:var(--mut);margin:0 auto 30px;max-width:320px}
.cap{display:inline-block;background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;padding:3px 14px;border-radius:2px}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.14s}.rv.d2{transition-delay:.28s}.rv.d3{transition-delay:.42s}

/* ---------- hero & penutup: foto latar ---------- */
.fotobg{background:#3d4a38 center/cover no-repeat;color:#fff}
.fotobg::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(28,36,26,.55),rgba(28,36,26,.18) 42%,rgba(24,30,22,.86))}
.fotobg::after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.55);z-index:0;pointer-events:none}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 26px 130px}
.hero .eyebrow,.end .eyebrow{color:rgba(255,255,255,.85)}
.hero .nm{font-family:var(--script);font-size:clamp(62px,19vw,86px);line-height:.98;margin:12px 0 10px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero .nm em{display:block;font-style:normal;font-size:.5em;color:#e2c98f;line-height:1}
.hero .tg{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;margin-left:.3em}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:320px;margin:26px auto 0}
.cd div{border:1px solid rgba(255,255,255,.6);padding:9px 0 6px;background:rgba(255,255,255,.1);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cd b{display:block;font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1}
.cd span{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
.cdn{font-family:var(--script);font-size:30px;color:#e2c98f}
.scroll{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px;letter-spacing:.35em;text-transform:uppercase;opacity:.85}
.scroll::after{content:"";width:1px;height:32px;background:#fff;animation:sc 1.8s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- salam ---------- */
.frame{position:relative;max-width:340px;margin:0 auto;padding:36px 26px 34px;background:var(--ivory);border:1px solid var(--gold);outline:1px solid rgba(184,151,90,.5);outline-offset:6px}
.frame h3{font-family:var(--script);font-weight:400;font-size:42px;line-height:1.1;color:var(--sage-d);margin-bottom:12px}
.frame p{font-size:12.5px;line-height:1.9}
.frame .ayat{margin-top:16px;padding-top:14px;border-top:1px solid rgba(184,151,90,.4);font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.7;color:var(--sage-d)}
.frame .ayat small{display:block;font-family:var(--sans);font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);margin-top:6px}

/* ---------- mempelai ---------- */
.arch{position:relative;width:min(70%,250px);aspect-ratio:3/4;margin:10px auto 0}
.arch::before{content:"";position:absolute;inset:-9px;border:1px solid var(--gold);border-radius:999px 999px 4px 4px}
.arch .im{position:absolute;inset:0;overflow:hidden;border-radius:999px 999px 4px 4px;background:var(--blush)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.pn{font-family:var(--script);font-size:58px;line-height:1.1;color:var(--sage-d);margin-top:24px}
.pf{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.06em;margin-top:-2px}
.po{font-size:12.5px;color:var(--mut);margin-top:8px}
.po b{font-weight:500;color:var(--ink)}
.ig{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;letter-spacing:.08em;text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:3px 14px;color:var(--sage-d)}
.ig svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.amp{font-family:var(--script);font-size:74px;line-height:1;color:var(--gold);margin:30px 0 8px}

/* ---------- cerita ---------- */
.tlin{position:relative;max-width:340px;margin:0 auto;padding-left:36px;text-align:left}
.tlin::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--gold)}
.ti{position:relative;margin-bottom:32px}
.ti::before{content:"";position:absolute;left:-36px;top:5px;width:17px;height:17px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold);box-shadow:inset 0 0 0 4px var(--ivory),inset 0 0 0 9px var(--sage)}
.ti small{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-d);font-weight:500}
.ti h3{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2;margin:2px 0 4px;color:var(--sage-d)}
.ti p{font-size:13px}

/* ---------- acara ---------- */
.ev{position:relative;max-width:330px;margin:0 auto 44px;padding:30px 22px 26px;background:var(--ivory);border:1px solid var(--gold);outline:1px solid rgba(184,151,90,.5);outline-offset:6px}
.ev .lbl{font-family:var(--script);font-size:44px;line-height:1.1;color:var(--sage-d)}
.dd{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 8px}
.dd span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;line-height:1.5;min-width:62px}
.dd b{font-family:var(--serif);font-weight:500;font-size:68px;line-height:1;color:var(--gold-d);padding:0 18px;border-left:1px solid var(--gold);border-right:1px solid var(--gold)}
.ev .jm{font-size:12px;letter-spacing:.16em;margin-bottom:14px}
.ev .tp{font-family:var(--serif);font-weight:600;font-size:19px}
.ev .al{font-size:12.5px;color:var(--mut);margin:2px auto 18px;max-width:250px}
.ev .bt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.livew{max-width:340px;margin:0 auto}

/* ---------- galeri ---------- */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in;background:var(--blush);border-radius:12px;transition:transform .3s}
.gal img:nth-child(4n+1),.gal img:nth-child(4n+4){border-radius:999px 999px 12px 12px}
.gal img:active{transform:scale(.97)}
.lb{position:fixed;inset:0;z-index:120;background:rgba(20,26,18,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.lb .x{top:18px;right:18px}.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}
.lb .c{position:absolute;bottom:22px;color:#fff;font-size:12px;letter-spacing:.2em}

/* ---------- hadiah ---------- */
.bank{position:relative;max-width:320px;margin:0 auto 24px;padding:24px 22px 24px;background:var(--ivory);border:1px solid var(--gold);outline:1px solid rgba(184,151,90,.5);outline-offset:6px}
.bank .bn{font-family:var(--serif);font-weight:600;font-size:24px;color:var(--sage-d)}
.bank .no{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:.1em;margin:4px 0 0;word-break:break-all}
.bank .an{font-size:12px;color:var(--mut);margin-bottom:14px}
.bank .ad{font-size:13px;margin:6px 0 14px}
/* tema kartu rekening per bank */
.bank[data-bk]{color:var(--bt);border:0;border-radius:14px;outline:1px solid var(--ba);outline-offset:6px;overflow:hidden;background:var(--pt),linear-gradient(140deg,var(--b1),var(--b2));box-shadow:0 10px 24px rgba(0,0,0,.18)}
.bank[data-bk]::before{content:"";position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);pointer-events:none}
.bank[data-bk]>*{position:relative;z-index:1}
.bank[data-bk] .bn{color:var(--bt);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:22px}
.bank[data-bk] .bn::after{content:"";display:block;width:38px;height:2px;border-radius:2px;background:var(--ba);margin:8px auto 10px}
.bank[data-bk] .bn.lgp{background:#fff;border-radius:12px;padding:12px 18px;display:flex;align-items:center;justify-content:center;min-height:64px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.bank[data-bk] .bn.lgp::after{display:none}
.bank .lg{display:block;height:38px;width:auto;max-width:170px}
.bank[data-bk] .no{color:var(--bt)}
.bank[data-bk] .an{color:var(--bt);opacity:.88}
.bank[data-bk] .btn.o{color:var(--bt);border-color:var(--ba);background:rgba(255,255,255,.14)}
.bank[data-bk=bca]{--b1:#0060AF;--b2:#00437d;--bt:#fff;--ba:#8cc0f2;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2260%22%20height=%2224%22%3E%3Cpath%20d=%22M0%2012%20Q15%200%2030%2012%20T60%2012%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=bri]{--b1:#0857C3;--b2:#053b88;--bt:#fff;--ba:#f7941d;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2228%22%20height=%2228%22%3E%3Cpath%20d=%22M14%201%2027%2014%2014%2027%201%2014Z%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=bni]{--b1:#005E6A;--b2:#003f48;--bt:#fff;--ba:#f26f21;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2222%22%20height=%2222%22%3E%3Cpath%20d=%22M-2%2024%2024-2M-2%2013%2013-2M9%2024%2024%209%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=mandiri]{--b1:#003A70;--b2:#00264d;--bt:#fff;--ba:#fcb017;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2236%22%20height=%2218%22%3E%3Cpath%20d=%22M0%204%2018%2016%2036%204%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=bsi]{--b1:#00A39D;--b2:#006f6b;--bt:#fff;--ba:#f8ad3c;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2240%22%20height=%2240%22%3E%3Cpath%20d=%22M20%203%2025%2015%2037%2020%2025%2025%2020%2037%2015%2025%203%2020%2015%2015Z%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=cimb]{--b1:#790008;--b2:#4d0005;--bt:#fff;--ba:#ed3024;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2234%22%20height=%2230%22%3E%3Cpath%20d=%22M9%201h16l8%2014-8%2014H9L1%2015Z%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=permata]{--b1:#0064FF;--b2:#003fa8;--bt:#fff;--ba:#9cc2ff;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2240%22%20height=%2240%22%3E%3Ccircle%20cx=%2220%22%20cy=%2220%22%20r=%2216%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3Ccircle%20cx=%2220%22%20cy=%2220%22%20r=%228%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}
.bank[data-bk=btn]{--b1:#015BFD;--b2:#0140b0;--bt:#fff;--ba:#ff8a8a;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2222%22%20height=%2222%22%3E%3Cpath%20d=%22M-2%2024%2024-2M-2%2013%2013-2M9%2024%2024%209%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}

/* ---------- ucapan ---------- */
.fm{max-width:360px;margin:0 auto;text-align:left}
.fm label.l{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin:0 0 2px;font-weight:400}
.fm input[type=text],.fm textarea{width:100%;border:0;border-bottom:1px solid var(--gold);padding:10px 2px;font:inherit;font-size:14px;background:transparent;color:var(--ink);outline:0;margin-bottom:20px;border-radius:0}
.fm textarea{min-height:96px;resize:vertical;border:1px solid var(--gold);padding:12px;margin-top:6px;background:rgba(255,255,255,.6)}
.fm input:focus,.fm textarea:focus{border-color:var(--sage-d);box-shadow:0 1px 0 var(--sage-d)}
.rd{display:grid;gap:8px;margin:8px 0 18px}

.rd input{accent-color:var(--sage-d);width:15px;height:15px}

.ck{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--mut);margin-bottom:18px}
.ck input{accent-color:var(--sage-d);margin-top:5px}
.fm .btn{width:100%}
.cnt{float:right;font-size:10px;color:var(--mut);letter-spacing:0}
.wl{max-width:360px;margin:30px auto 0;max-height:430px;overflow:auto;text-align:left;display:grid;gap:12px;padding:2px;scrollbar-width:thin}
.wi{display:flex;gap:12px;padding:14px 14px;border-left:2px solid var(--gold);background:rgba(255,255,255,.65)}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sage);color:var(--ivory);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:19px}
.wi b{font-family:var(--serif);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.wi p{font-size:12.5px;margin-top:1px;overflow-wrap:anywhere;white-space:pre-line}
.bd{display:inline-block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 9px;border:1px solid var(--sage);color:var(--sage-d);border-radius:999px;margin-left:8px;vertical-align:middle}
.bd.t{border-color:#c98b7e;color:#a8604f}.bd.r{border-color:var(--gold);color:var(--gold-d)}
.wt{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.emp{font-size:12.5px;color:var(--mut)}

/* ---------- navigasi & musik ---------- */
.nav{position:fixed;z-index:100;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;width:min(92vw,400px);transform:translate(-50%,140%);display:flex;justify-content:space-around;background:rgba(251,248,241,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(184,151,90,.55);border-radius:999px;padding:8px 8px 6px;box-shadow:0 12px 32px rgba(0,0,0,.28);transition:transform .7s cubic-bezier(.2,.8,.2,1.1)}
.nav.on{transform:translate(-50%,0)}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0 0;border-radius:14px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;text-decoration:none;color:var(--mut);transition:.25s;--c1:#b9b9b9;--c2:#8c8c8c}
.nav a svg{box-sizing:content-box;width:19px;height:19px;padding:8px;border-radius:50%;color:#fff;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 60%;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 0 0 3px #fff,0 7px 11px rgba(0,0,0,.26),inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.4);transition:background .3s,box-shadow .3s;animation:wig 2.6s ease-in-out infinite}
.nav a:nth-child(2) svg{animation-delay:.35s}.nav a:nth-child(3) svg{animation-delay:.7s}.nav a:nth-child(4) svg{animation-delay:1.05s}.nav a:nth-child(5) svg{animation-delay:1.4s}.nav a:nth-child(6) svg{animation-delay:1.75s}
@keyframes wig{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-14deg)}84%{transform:rotate(12deg)}92%{transform:rotate(-8deg)}}
.nav a.on{background:none;color:var(--c2);font-weight:600}
.nav a.on svg{animation:pop 1.6s ease-in-out infinite}
.nav a.on[data-s=beranda]{--c1:#9bb08c;--c2:#566b4d}
.nav a.on[data-s=mempelai]{--c1:#eaa0a8;--c2:#c25a6a}
.nav a.on[data-s=acara]{--c1:#e6c06a;--c2:#b8862e}
.nav a.on[data-s=galeri]{--c1:#6fb8b0;--c2:#2f7f78}
.nav a.on[data-s=hadiah]{--c1:#f2a46a;--c2:#d0662a}
.nav a.on[data-s=ucapan]{--c1:#86a8e6;--c2:#4a6fba}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.2) rotate(-6deg)}}
.mu{position:fixed;z-index:101;right:max(14px,calc(50% - 226px));bottom:calc(106px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:1px solid var(--ivory);background:var(--gold);color:var(--ivory);display:none;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.mu.on{display:grid}
.mu svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mu.play svg{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;z-index:200;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--sage-d);color:var(--ivory);padding:10px 20px;font-size:12px;border-radius:999px;opacity:0;pointer-events:none;transition:.35s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{padding:60px 24px;text-align:center}

function bk(n){var x=String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/^bank/,''),M=[['bca',/^(bca|centralasia)/],['bri',/^(bri|rakyatindonesia)/],['bni',/^(bni|negaraindonesia)/],['mandiri',/^mandiri/],['bsi',/^(bsi|syariahindonesia)/],['cimb',/^cimb/],['permata',/^permata/],['btn',/^(btn|tabungannegara)/],['danamon',/^danamon/],['jago',/^jago/],['seabank',/^seabank/],['dana',/^dana$/],['ovo',/^ovo$/],['gopay',/^gopay/],['shopeepay',/^(shopeepay|spay)/],['linkaja',/^linkaja/],['jenius',/^(jenius|btpn)/],['maybank',/^maybank/],['ocbc',/^ocbc/],['bjb',/^bjb/],['neo',/^neo/],['muamalat',/^muamalat/]];for(var i=0;i<M.length;i++)if(M[i][1].test(x))return M[i][0];return''}

function tgl(s){var p=String(s||'').split('-');if(p.length<3)return '';var d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+', '+(+p[2])+' '+BLN[+p[1]-1]+' '+p[0]}
function jam(s){return String(s||'').replace(':','.')}
function rentang(e){return jam(e.jamMulai)+(e.jamSelesai?' - '+jam(e.jamSelesai):' - selesai')+' '+ZONA}

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2800)}
function salin(txt,pesan){
  function ok(){toast(pesan||'Tersalin')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Gagal menyalin')}a.remove()}
}
function ago(d){var s=(Date.now()-d.getTime())/1000;if(s<60)return 'baru saja';if(s<3600)return Math.floor(s/60)+' menit lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';if(s<2592000)return Math.floor(s/86400)+' hari lalu';return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}

function leafG(){
  var s='',i,y,sc;
  for(i=0;i<7;i++){
    y=-18-i*22;sc=(1-i*.06).toFixed(2);
    s+='<ellipse rx="7" ry="15" transform="translate(0 '+y+') rotate(-52) translate(0 -13) scale('+sc+')" fill="'+(i%2?'#8fa283':'#73876a')+'" fill-opacity=".92"/>';
    s+='<ellipse rx="7" ry="15" transform="translate(0 '+y+') rotate(52) translate(0 -13) scale('+sc+')" fill="'+(i%2?'#73876a':'#8fa283')+'" fill-opacity=".92"/>';
  }
  return '<path d="M0 0C-4 -50 4 -110 0 -170" fill="none" stroke="#5f7356" stroke-width="2" stroke-linecap="round"/>'+s+'<ellipse cx="0" cy="-174" rx="6" ry="14" fill="#7f9272"/>';
}
function flowerG(a,b){
  var s='',i;
  for(i=0;i<8;i++)s+='<ellipse rx="9" ry="22" transform="rotate('+(i*45)+') translate(0 -17)" fill="'+a+'" fill-opacity=".72"/>';
  for(i=0;i<8;i++)s+='<ellipse rx="6.5" ry="15" transform="rotate('+(i*45+22.5)+') translate(0 -11)" fill="'+b+'" fill-opacity=".9"/>';
  return s+'<circle r="6.5" fill="#c9a45e"/><circle r="2.2" cx="-2" cy="-1.5" fill="#f5e3b0"/>';
}
function corner(pos){
  return '<svg class="dc fl '+pos+'" viewBox="0 0 220 220" aria-hidden="true">'+
   '<g transform="rotate(128) scale(.95)">'+leafG()+'</g>'+
   '<g transform="rotate(150) scale(.7)">'+leafG()+'</g>'+
   '<g transform="rotate(106) scale(.62)">'+leafG()+'</g>'+
   '<g transform="translate(62 50) scale(.78)">'+flowerG('#ecd3cb','#f8e9e2')+'</g>'+
   '<g transform="translate(26 108) scale(.46)">'+flowerG('#e2b4a8','#f3d8d0')+'</g>'+
   '<g transform="translate(112 26) scale(.4)">'+flowerG('#e2b4a8','#f3d8d0')+'</g></svg>';

function countdown(){
  var el=$('#cd');if(!el||!ak&&!rs)return;
  var tgt=wkt(utama.tanggal,utama.jamMulai).getTime();
  function t(){
    var d=tgt-Date.now();
    if(d<=0){el.style.display='block';el.style.border='0';el.className='cdn rv in';el.textContent='Alhamdulillah, acara telah berlangsung. Terima kasih atas doa Anda.';return}
    var s=Math.floor(d/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    el.innerHTML=[[dd,'Hari'],[hh,'Jam'],[mm,'Menit'],[ss,'Detik']].map(function(x){return '<div><b>'+String(x[0]).padStart(2,'0')+'</b><span>'+x[1]+'</span></div>'}).join('');
    setTimeout(t,1000);
  }
  t();
}
function reveal(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  $$('.rv').forEach(function(e){io.observe(e)});
}
function nav(){
  var items=[['beranda','home','Awal'],['mempelai','heart','Mempelai'],['acara','cal','Acara'],['galeri','img','Galeri'],['hadiah','gift','Gift'],['ucapan','msg','Ucapan']].filter(function(i){return $('#'+i[0])});
  $('#nav').innerHTML=items.map(function(i){return '<a href="#'+i[0]+'" data-s="'+i[0]+'"><svg viewBox="0 0 24 24">'+IC[i[1]]+'</svg>'+i[2]+'</a>'}).join('');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.s===e.target.id)})}})},{rootMargin:'-45% 0px -50% 0px'});
  items.forEach(function(i){io.observe($('#'+i[0]))});
}
function galeri(){
  var g=$('#gal');if(!g)return;var lb=$('#lb'),im=$('img',lb),c=$('.c',lb),cur=0,L=D.galeri;
  function show(i){cur=(i+L.length)%L.length;im.src=L[cur];c.textContent=(cur+1)+' / '+L.length}
  g.addEventListener('click',function(e){var t=e.target.closest('img');if(!t)return;show(+t.dataset.i);lb.classList.add('on')});
  $('.x',lb).onclick=function(){lb.classList.remove('on')};
  $('.p',lb).onclick=function(){show(cur-1)};$('.n',lb).onclick=function(){show(cur+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on')});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
  var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
}
function musik(){
  var a=$('#aud'),b=$('#mu');
  if(!D.musik){return {mulai:function(){}}}
  a.src=D.musik;var gagal=false;
  a.addEventListener('error',function(){if(!gagal){gagal=true;toast('Musik tidak dapat diputar. Periksa file musik.')}b.classList.remove('play')});
  a.addEventListener('play',function(){b.classList.add('play')});a.addEventListener('pause',function(){b.classList.remove('play')});
  b.onclick=function(){if(a.paused){a.play().catch(function(){toast('Musik tidak dapat diputar. Periksa file musik.')})}else a.pause()};
  return {mulai:function(){b.classList.add('on');a.play().catch(function(){})}};
}

function lokal(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]').map(function(u){u.waktu=new Date(u.waktu);return u})}catch(e){return []}}
function simpanLokal(u){try{var l=JSON.parse(localStorage.getItem(LKEY)||'[]');l.unshift(u);localStorage.setItem(LKEY,JSON.stringify(l.slice(0,50)))}catch(e){}}
var HD={hadir:['Hadir',''],tidak:['Berhalangan','t'],ragu:['Ragu','r']};
function daftar(){
  var el=$('#wl');if(!el)return;
  function tampil(arr,catatan){
    if(!arr.length){el.innerHTML='<div class="emp">'+esc(catatan||'Jadilah yang pertama mengirimkan ucapan.')+'</div>';return}
    el.innerHTML=arr.map(function(u){var b=HD[u.hadir]||HD.hadir;return '<div class="wi"><div class="av">'+esc((u.nama||'?').trim().charAt(0).toUpperCase())+'</div><div><b>'+esc(u.nama)+'</b><span class="bd '+b[1]+'">'+b[0]+'</span><p>'+esc(u.isi)+'</p><span class="wt">'+esc(ago(u.waktu))+'</span></div></div>'}).join('');
  }
  var seed=(D.ucapan||[]).map(function(u){return {nama:u.nama,isi:u.isi,hadir:u.hadir||'hadir',waktu:new Date(u.waktu||Date.now())}});
  if(!S.ucapanPublik){tampil([], 'Ucapan hanya dapat dibaca oleh mempelai. Terima kasih atas doa Anda.');return}
  if(FB.aktif){FB.daftarUcapan(false).then(function(a){tampil(a)}).catch(function(){tampil(lokal().concat(seed))})}
  else tampil(lokal().concat(seed));
}
function form(){
  var f=$('#fm');if(!f)return;
  $('#fi').addEventListener('input',function(){$('#cnt').textContent=this.value.length+'/300'});
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var nama=$('#fn').value.trim(),isi=$('#fi').value.trim(),hd=(f.querySelector('input[name=hd]:checked')||{}).value||'hadir';
    if(!nama||!isi){toast('Nama dan ucapan wajib diisi');return}
    var btn=$('#fs');btn.disabled=true;
    var u={nama:nama.slice(0,40),isi:isi.slice(0,300),hadir:hd};
    var wa=$('#fw')&&$('#fw').checked;
    function selesai(){
      toast('Ucapan terkirim. Terima kasih!');$('#fi').value='';$('#cnt').textContent='0/300';btn.disabled=false;daftar();
      if(wa){var st={hadir:'Insya Allah hadir',tidak:'Mohon maaf, belum bisa hadir',ragu:'Masih ragu'}[hd];
        window.open('https://wa.me/'+String(D.pemesan.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent('Assalamu\'alaikum, saya '+u.nama+'.\nKonfirmasi kehadiran: '+st+'.\n\nUcapan: '+u.isi),'_blank')}
    }
    if(FB.aktif){FB.kirimUcapan(u).then(selesai).catch(function(){btn.disabled=false;toast('Ucapan gagal terkirim. Coba lagi.')})}
    else{u.waktu=new Date();simpanLokal(u);selesai()}
  });
}

/* ---------- pengaturan dari admin ---------- */
function terapkan(){
  $$('#bank [data-r]').forEach(function(e){e.style.display=S.rek[+e.dataset.r]===false?'none':''});
  if(S.turut&&D.turutMengundang&&D.turutMengundang.length){var t=$('#turut');t.style.display='';$('#tm').innerHTML=D.turutMengundang.map(esc).join('<br>');t.querySelectorAll('.rv').forEach(function(e){e.classList.add('in')})}
}
function muatPengaturan(){
  if(!FB.aktif)return Promise.resolve();
  return FB.pengaturan().then(function(p){if(!p)return;
    if(typeof p.ucapanPublik==='boolean')S.ucapanPublik=p.ucapanPublik;
    if(typeof p.turutTampil==='boolean')S.turut=p.turutTampil;
    if(typeof p.rekening1==='boolean')S.rek[0]=p.rekening1;
    if(typeof p.rekening2==='boolean')S.rek[1]=p.rekening2;
  }).catch(function(){});
}

/* ---------- mulai ---------- */
build();
$('#bgfx').style.backgroundImage=F.sampul?'url('+F.sampul+')':'';
$('#side').innerHTML='<div class="e">The Wedding Of</div><div class="n">'+esc(NAMA)+'</div>'+(utama?'<div class="d">'+esc(tgl(utama.tanggal))+'</div>':'')+(tamu?'<div class="t">Kepada Yth. '+esc(tamu)+'</div>':'');
var M=musik();
reveal();countdown();nav();galeri();form();
muatPengaturan().then(function(){terapkan();daftar()});
$$('[data-cp]').forEach(function(b){b.onclick=function(){salin(b.dataset.cp,'Berhasil disalin')}});
$('#buka').onclick=function(){
  $('#cover').classList.add('out');document.body.classList.remove('lock');M.mulai();
  setTimeout(function(){$('#nav').classList.add('on')},700);window.scrollTo(0,0);
};
})();
</script>
</body>
